[project]
name = "videopython-chatterbox"
version = "0.1.7.post1"
description = "Chatterbox TTS (Resemble AI) with corrected dependency metadata. Upstream source, one line changed."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "resemble-ai", email = "engineering@resemble.ai" }]
maintainers = [{ name = "Bartosz Wójtowicz", email = "bartoszwojtowicz@outlook.com" }]
keywords = ["tts", "text-to-speech", "voice-cloning", "chatterbox"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Upstream chatterbox-tts 0.1.7 pins these with `==`, which makes it
# unsatisfiable alongside any modern ML stack. Verified on 2026-08-02 that the
# pins are not load-bearing: real synthesis + voice cloning on
# torch 2.13.0 / diffusers 0.39.0 / transformers 5.14.1 / numpy 2.4.6 produces
# output bit-identical (seeded, max|diff| = 0.0) to the same run under the
# upstream pins. See README.md for the full comparison.
dependencies = [
    "numpy>=1.24.0",           # upstream: <2.0.0 for py<3.13
    "librosa>=0.11.0",         # upstream: ==0.11.0
    "s3tokenizer",
    "torch>=2.6.0",            # upstream: ==2.6.0
    "torchaudio>=2.6.0",       # upstream: ==2.6.0
    "transformers>=5.2.0",     # upstream: ==5.2.0
    # Upstream: ==0.29.0. Only the vendored Matcha-TTS decoder touches diffusers
    # (9 symbols, all still present in 0.39). The <1.0 cap IS load-bearing:
    # LoRACompatibleLinear is deprecated for removal in diffusers 1.0.0.
    "diffusers>=0.29.0,<1.0",
    "resemble-perth>=1.0.0",
    "conformer>=0.3.2",        # upstream: ==0.3.2
    "safetensors>=0.5.3",      # upstream: ==0.5.3
    "spacy-pkuseg",
    "pykakasi>=2.3.0",         # upstream: ==2.3.0
    "pyloudnorm",
    "omegaconf",
    # Not declared upstream, but required: resemble-perth declares no
    # dependencies at all and imports pkg_resources, which setuptools removed in
    # 82+. perth/__init__.py swallows the ImportError and sets
    # PerthImplicitWatermarker = None, so chatterbox fails at model load with a
    # confusing `TypeError: 'NoneType' object is not callable` instead.
    "setuptools<81",
]
# gradio==6.8.0 is intentionally dropped: it is not imported anywhere in the
# shipped package (it backs upstream's demo app, which this fork does not ship).

[project.urls]
Homepage = "https://github.com/BartWojtowicz/videopython-chatterbox"
Repository = "https://github.com/BartWojtowicz/videopython-chatterbox"
Upstream = "https://github.com/resemble-ai/chatterbox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatterbox"]

[tool.hatch.build.targets.sdist]
include = ["src/chatterbox", "LICENSE", "NOTICE", "README.md"]
